<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e7490"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>جودة الرصيف</title>
<style>
:root{--c:#0e7490;--b:#1e3a8a;--g:#166534;--d:#374151;--bg:#e8eef2}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,Arial,sans-serif;background:var(--bg);color:#111827;padding-bottom:80px}
header{background:linear-gradient(135deg,var(--b),var(--c));color:#fff;padding:14px 16px;font-weight:700;font-size:18px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between}
main{padding:12px;max-width:720px;margin:auto}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0003}
h3{margin:0 0 10px;color:var(--b)}
button{background:var(--c);color:#fff;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;width:100%;margin:5px 0;font-family:inherit}
button.s{background:var(--d)}button.r{background:#dc2626}button.gr{background:var(--g)}button.sm{width:auto;padding:8px 14px;font-size:14px}
input,select,textarea{width:100%;padding:12px;font-size:16px;border:1px solid #9ca3af;border-radius:10px;margin:4px 0 8px;font-family:inherit;background:#fff}
label{font-size:14px;color:var(--d);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{padding:20px 6px;margin:0}
.it{border-top:1px solid #e5e7eb;padding:10px 0}.ch{display:flex;gap:6px;margin-top:6px}
.o{flex:1;text-align:center;padding:10px 2px;border-radius:10px;border:2px solid #d1d5db;font-size:14px}
.o input{width:auto;margin:0 4px}.o0{border-color:#16a34a}.o1{border-color:#f59e0b}.o2{border-color:#dc2626}
.hid{display:none}.iss{border-right:8px solid #999}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--d);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;text-align:center;color:#cbd5e1;padding:12px 2px;font-size:13px}.nav a.on{color:#fff;background:var(--c);font-weight:700}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.kp div{background:#f1f5f9;border-radius:10px;padding:10px 2px;font-size:13px}.kp b{display:block;font-size:22px}
.bar{height:22px;border-radius:6px;margin:3px 0;color:#fff;font-size:12px;padding:2px 6px;min-width:26px}
.tag{display:inline-block;border-radius:8px;color:#fff;padding:2px 10px;font-size:13px}
img.p{max-width:100%;border-radius:10px;margin-top:6px}
.err{color:#dc2626;font-size:14px}small{color:#6b7280}
@media print{header,.nav,.np{display:none}body{background:#fff}}
</style></head><body><div id="app"></div>
<script type="module">

const cfg={apiKey:"AIzaSyAXW6iW2zqotKpYVEarrxjIp7-HHtwMEy0",authDomain:"dock-quality-71742.firebaseapp.com",projectId:"dock-quality-71742",storageBucket:"dock-quality-71742.firebasestorage.app",messagingSenderId:"44921742974",appId:"1:44921742974:web:90362dce6b561776fb5a2f"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=()=>ymd(new Date());

const inR=d=>F.m=='all'||(F.m=='today'?d==today():F.m=='7'?d>=ago(6):F.m=='30'?d>=ago(29):d==F.d);
const rng=(a,b)=>v=>v>=a&&v<=b,R=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
function pn(s){s=String(s).trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[−–—]/g,'-').replace('٫','.');if(/^\d+(\.\d+)?-$/.test(s))s='-'+s.slice(0,-1);const v=parseFloat(s);return isNaN(v)?null:v}
const OPT=['مطابق','ملاحظة','غير مطابق'],STS={'تم الحل':'#16a34a','قيد التنفيذ':'#f59e0b','لم يتم الاستجابة':'#dc2626'};
const car=[{k:'car',l:'رقم السيارة'},{k:'driver',l:'اسم السائق'},{k:'agent',l:'اسم الوكيل'}];
const SEC={
dock:{t:'فحص رصيف التحميل',meta:[{k:'door',l:'رقم الباب',o:R(1,19)}],items:['حالة باب الرصيف','حالة الستائر الهوائية','نظافة الرصيف','حالة مصائد الحشرات','حالة الصرف']},
fork:{t:'فحص الشوكيات',meta:[{k:'no',l:'رقم الشوكية'},{k:'place',l:'مكان العمل'}],items:['حالة الشوكية','نظافة الشوكية']},
post:{t:'فحص البراد بعد التحميل',meta:[...car.slice(0,2),car[2],{k:'carrier',l:'جهة النقل',o:['شركة','أهلية']},{k:'ptype',l:'نوع المنتج المحمل',o:['مجمد','فريش']}],
 nums:[{k:'sign',l:'درجة التوقيع (مجمد: 7- أو أبرد | فريش: 0 إلى 2+)',ok:(v,m)=>m.ptype=='مجمد'?v<=-7:v>=0&&v<=2},{k:'set',l:'درجة ضبط البراد (مجمد: 20- | فريش: 0)',ok:(v,m)=>m.ptype=='مجمد'?v==-20:v==0}],items:[],photoOnly:'صورة شاشة البراد'},
pre:{t:'فحص السيارات قبل التحميل',meta:[...car,{k:'ptype',l:'نوع الحمولة',o:['مجمد','فريش']}],nums:[{k:'t',l:'درجة حرارة البراد قبل التحميل (0 إلى 10+)',ok:rng(0,10)}],
 items:['نظافة السيارة','حالة تبريد السيارة','حالة شاشة قراءة الدرجة','السيارة خالية من أي روائح','باب البراد محكم الغلق','نظافة السيارة من الخارج']},
fresh:{t:'فحص ثلاجات الفريش',meta:[{k:'fridge',l:'رقم الثلاجة',o:[11,12,13]}],nums:[{k:'t',l:'درجة حرارة الثلاجة (0 إلى 4)',ok:rng(0,4)},{k:'p',l:'درجة حرارة المنتج (0 إلى 4)',ok:rng(0,4)}],
 items:['حالة التبريد','حالة باب الثلاجة','نظافة الثلاجة','ترتيب المنتجات وعدم تلامسها مع الأرض','تاريخ الصلاحية والإنتاج واضح على المنتج','حالة شاشة قراءة الدرجة','حالة العبوات'],waste:'عبوات'},
froz:{t:'فحص الثلاجات المجمد',meta:[{k:'fridge',l:'رقم الثلاجة',o:R(1,10)}],nums:[{k:'t',l:'درجة حرارة الثلاجة (12- إلى 18-)',ok:rng(-18,-12)},{k:'p',l:'درجة حرارة المنتج (10- أو أبرد)',ok:v=>v<=-10}],
 items:['حالة التبريد','حالة باب الثلاجة','نظافة الثلاجة','خلو الثلاجة من الثلج المتراكم','ترتيب المنتجات وعدم تلامسها مع الأرض','تاريخ الصلاحية والإنتاج واضح على الكراتين','تطبيق نظام الأقدم أولًا (FIFO)','حالة الكراتين أثناء التحميل'],waste:'كراتين'}};
let S={u:null,role:'',name:'',insp:[],iss:[],sal:[],usr:[]},P='home',sub='',F={m:'today',d:today()},un=[],msg='';
const adm=()=>S.role=='admin',can=o=>adm()||o.uid==S.u.uid;
const sum=(a,f)=>a.reduce((x,y)=>x+(+f(y)||0),0);
const wk=d=>{const t=new Date(d);t.setDate(t.getDate()-((t.getDay()+1)%7));return ymd(t)};
function group(a,kf,vf){const g={};a.forEach(x=>{const k=kf(x);g[k]=(g[k]||0)+(+vf(x)||0)});return Object.entries(g).sort((x,y)=>y[0].localeCompare(x[0]))}
const bars=a=>{const m=Math.max(1,...a.map(x=>x[1]));return a.map(x=>`<div class=bar style="width:${Math.max(8,x[1]/m*100)}%;background:${x[2]||'#0e7490'}">${esc(x[0])}: ${x[1]}</div>`).join('')};
const comp=f=>new Promise(r=>{if(!f)return r(null);const i=new Image();i.onload=()=>{const s=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};i.onerror=()=>r(null);i.src=URL.createObjectURL(f)});
const go=(p,s)=>{P=p;sub=s||'';msg='';render();scrollTo(0,0)};
const typing=()=>/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');
onAuthStateChanged(auth,async u=>{un.forEach(f=>f());un=[];if(!u){S.u=null;return render()}
 let d=null;try{d=await getDoc(doc(db,'users',u.uid))}catch(e){}
 S.u=u;S.role=d&&d.exists()?d.data().role:'user';S.name=d&&d.exists()?d.data().name:u.email;
 [['inspections','insp'],['issues','iss'],['sales','sal']].forEach(([c,k])=>un.push(onSnapshot(query(collection(db,c),orderBy('ts','desc')),s=>{S[k]=s.docs.map(x=>({id:x.id,...x.data()}));if(!typing())render()},e=>console.error(e))));
 un.push(onSnapshot(collection(db,'users'),s=>{S.usr=s.docs.map(x=>({id:x.id,...x.data()}));if(!typing())render()}));render()});
function render(){const A=$('app');if(!S.u){A.innerHTML=`<header>جودة الرصيف</header><main><div class=card><h3>تسجيل الدخول</h3><label>البريد الإلكتروني</label><input id=em type=email><label>كلمة المرور</label><input id=pw type=password><div class=err>${msg}</div><button onclick="login()">دخول</button></div></main>`;return}
 const T={home:'الرئيسية',check:'الفحوصات',issues:'المشاكل',reports:'التقارير',waste:'تقرير التوالف',sales:'إجمالي المبيعات',settings:'الإعدادات'};
 A.innerHTML=`<header><span>${T[P]}</span><small style="color:#fff">${esc(S.name)}${adm()?' (مسؤول)':''}</small></header><main>${PG[P]()}</main><div class=nav>${[['home','الرئيسية'],['check','الفحوصات'],['issues','المشاكل'],['reports','التقارير'],['settings','الإعدادات']].map(([k,l])=>`<a class="${P==k?'on':''}" onclick="go('${k}')">${l}</a>`).join('')}</div>`}
window.go=go;
window.login=async()=>{try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value)}catch(e){msg='البريد أو كلمة المرور غير صحيحة';render()}};
window.out=()=>signOut(auth);
const filt=()=>`<div class="card np"><label>الفترة</label><select onchange="F.m=this.value;render()">${[['today','تقرير اليوم'],['7','آخر 7 أيام'],['30','آخر 30 يومًا'],['all','الكل'],['day','يوم معين']].map(([v,l])=>`<option value=${v} ${F.m==v?'selected':''}>${l}</option>`).join('')}</select>${F.m=='day'?`<input type=date value="${F.d}" onchange="F.d=this.value;render()">`:''}</div>`;
window.F=F;window.render=render;
const PG={
home(){const t=today();return`<div class=card><h3>مرحبًا ${esc(S.name)}</h3><div class=kp><div><b>${S.insp.filter(x=>x.date==t).length}</b>فحوصات اليوم</div><div><b>${S.iss.filter(x=>x.status!='تم الحل').length}</b>مشاكل مفتوحة</div><div><b>${sum(S.sal.filter(x=>x.date==t),x=>x.frozen+x.fresh+x.proc)}</b>مبيعات اليوم</div></div></div>
<div class=grid><button onclick="go('check')">الفحوصات</button><button class=s onclick="go('issues')">المشاكل</button><button class=gr onclick="go('reports')">التقارير والرسوم</button><button onclick="go('waste')">تقرير التوالف</button><button class=s onclick="go('sales')">المبيعات</button><button class=gr onclick="go('settings')">الإعدادات</button></div>`},
check(){if(sub)return form(sub);return Object.entries(SEC).map(([k,s])=>`<button onclick="go('check','${k}')">${s.t}</button>`).join('')+`<button class=s onclick="go('sales')">المبيعات</button>`},
issues(){const h=`<div class=card><h3>رفع حالة / مشكلة</h3><label>القسم</label><select id=is_sec>${Object.values(SEC).map(s=>`<option>${s.t}</option>`).join('')}<option>أخرى</option></select><label>تفاصيل المشكلة</label><textarea id=is_tx rows=3></textarea><label>صورة (اختياري)</label><input type=file accept="image/*" id=is_ph><button onclick="addIssue()">حفظ الحالة</button></div>`;
 return h+(S.iss.map(x=>`<div class="card iss" style="border-color:${STS[x.status]}"><b>${esc(x.sec)}</b><br>${esc(x.text)}<br><small>${esc(x.name)} • ${new Date(x.ts).toLocaleString('ar-EG')}</small>${x.photo?`<img class=p src="${x.photo}">`:''}
 <div style="margin-top:8px"><span class=tag style="background:${STS[x.status]}">${x.status}</span></div>${can(x)?`<label>تحديد الحالة</label><select onchange="setSt('${x.id}',this.value)">${Object.keys(STS).map(s=>`<option ${s==x.status?'selected':''}>${s}</option>`).join('')}</select>${adm()?`<div class=row><button class="sm s" onclick="edIss('${x.id}')">تعديل</button><button class="sm r" onclick="delDoc('issues','${x.id}')">حذف</button></div>`:''}`:''}</div>`).join('')||'<div class=card>لا توجد حالات بعد</div>')},
reports(){const I=S.insp.filter(x=>inR(x.date)),Is=S.iss.filter(x=>inR(ymd(new Date(x.ts)))),Sa=S.sal.filter(x=>inR(x.date));
 const ok=sum(I,x=>x.counts.ok),nt=sum(I,x=>x.counts.note),bd=sum(I,x=>x.counts.bad),tot=ok+nt+bd,w=I.filter(x=>x.waste),wq=sum(w,x=>x.waste.qty),sc=s=>Is.filter(x=>x.status==s).length,ts=sum(Sa,x=>x.frozen+x.fresh+x.proc);
 const txt=`تقرير جودة الرصيف\nعدد الفحوصات: ${I.length}\nمطابق: ${ok} | ملاحظات: ${nt} | غير مطابق: ${bd}\nنسبة المطابقة: ${tot?Math.round(ok/tot*100):0}%\nالمشاكل: حُلت ${sc('تم الحل')} | قيد التنفيذ ${sc('قيد التنفيذ')} | بلا استجابة ${sc('لم يتم الاستجابة')}\nالتوالف: ${wq}\nالمبيعات: ${ts}`;window.WA=txt;
 return filt()+`<div class=card><h3>ملخص الفحوصات</h3><div class=kp><div><b>${I.length}</b>إجمالي الفحوصات</div><div><b style="color:#16a34a">${ok}</b>مطابق</div><div><b style="color:#f59e0b">${nt}</b>ملاحظة</div><div><b style="color:#dc2626">${bd}</b>غير مطابق</div><div><b>${tot?Math.round(ok/tot*100):0}%</b>نسبة المطابقة</div><div><b>${tot?Math.round(bd/tot*100):0}%</b>عدم المطابقة</div></div></div>
<div class=card><h3>المشاكل (${Is.length})</h3>${bars([['تم الحل',sc('تم الحل'),'#16a34a'],['قيد التنفيذ',sc('قيد التنفيذ'),'#f59e0b'],['لم يتم الاستجابة',sc('لم يتم الاستجابة'),'#dc2626']])}</div>
<div class=card><h3>التوالف والمبيعات</h3><div class=kp><div><b>${wq}</b>إجمالي التوالف</div><div><b>${ts}</b>إجمالي المبيعات</div><div><b>${sum(Sa,x=>x.frozen)}/${sum(Sa,x=>x.fresh)}/${sum(Sa,x=>x.proc)}</b>مجمد/فريش/مصنعات</div></div></div>
<div class="card np"><button class=gr onclick="window.print()">استخراج PDF / طباعة</button><button onclick="location.href='https://wa.me/?text='+encodeURIComponent(WA)">مشاركة واتساب</button></div>
<div class=card><h3>الفحوصات المسجلة</h3>${I.map(x=>`<div class=it><b>${esc(x.title)}</b> <small>${x.date} • ${esc(x.name)}</small><br><small>${Object.values(x.meta).map(esc).join(' • ')}</small><br>✅${x.counts.ok} ⚠️${x.counts.note} ❌${x.counts.bad}${x.items.filter(i=>i.st!='مطابق').map(i=>`<br>${i.st=='ملاحظة'?'⚠️':'❌'} ${esc(i.l)} ${esc(i.note)}${i.photo?`<img class=p src="${i.photo}">`:''}`).join('')}${can(x)?`<br><button class="sm r np" onclick="delDoc('inspections','${x.id}')">حذف</button>`:''}</div>`).join('')||'لا توجد فحوصات في هذه الفترة'}</div>`},
waste(){const W=S.insp.filter(x=>x.waste),Wf=W.filter(x=>inR(x.waste.date||x.date)),q=l=>sum(W.filter(x=>(x.waste.date||x.date)>=l),x=>x.waste.qty);
 return`<div class=card><h3>إجمالي التوالف</h3><div class=kp><div><b>${sum(W.filter(x=>(x.waste.date||x.date)==today()),x=>x.waste.qty)}</b>اليوم</div><div><b>${q(ago(6))}</b>7 أيام</div><div><b>${q(ago(29))}</b>30 يومًا</div></div></div>`+filt()+`<div class=card><h3>التفاصيل</h3>${Wf.map(x=>`<div class=it><b>${esc(x.waste.product)}</b> — ${x.sec=='fresh'?'فريش':'مجمد'}<br>ثلاجة ${esc(x.meta.fridge)} • ${x.waste.date||x.date} • ${x.waste.qty} ${x.waste.unit}</div>`).join('')||'لا توالف'}</div><div class=card><h3>أسبوعيًا</h3>${group(Wf,x=>wk(x.waste.date||x.date),x=>x.waste.qty).map(([k,v])=>`<div>أسبوع ${k}: <b>${v}</b></div>`).join('')}<h3 style="margin-top:12px">شهريًا</h3>${group(Wf,x=>(x.waste.date||x.date).slice(0,7),x=>x.waste.qty).map(([k,v])=>`<div>${k}: <b>${v}</b></div>`).join('')}</div>`},
sales(){const t=x=>x.frozen+x.fresh+x.proc,Sa=S.sal.filter(x=>inR(x.date)),q=l=>sum(S.sal.filter(x=>x.date>=l),t),days=group(Sa,x=>x.date,t);
 return`<div class=card><h3>تسجيل مبيعات</h3><label>التاريخ</label><input type=date id=sl_d value="${today()}"><label>عدد البيع المجمد</label><input type=number id=sl_f><label>عدد البيع الفريش</label><input type=number id=sl_r><label>عدد البيع المصنعات</label><input type=number id=sl_p><button onclick="addSale()">حفظ</button></div>
<div class=card><div class=kp><div><b>${sum(S.sal.filter(x=>x.date==today()),t)}</b>اليوم</div><div><b>${q(ago(6))}</b>7 أيام</div><div><b>${q(ago(29))}</b>30 يومًا</div></div></div>`+filt()+`<div class=card><h3>المجمد ${sum(Sa,x=>x.frozen)} | الفريش ${sum(Sa,x=>x.fresh)} | المصنعات ${sum(Sa,x=>x.proc)}</h3>${bars(days.slice(0,10).map(([k,v])=>[k,v]))}</div>
<div class=card><h3>أسبوعيًا</h3>${group(Sa,x=>wk(x.date),t).map(([k,v])=>`<div>أسبوع ${k}: <b>${v}</b></div>`).join('')}<h3 style="margin-top:12px">شهريًا</h3>${group(Sa,x=>x.date.slice(0,7),t).map(([k,v])=>`<div>${k}: <b>${v}</b></div>`).join('')}</div>
<div class=card><h3>السجلات</h3>${Sa.map(x=>`<div class=it>${x.date} • ${esc(x.name)}<br>مجمد ${x.frozen} • فريش ${x.fresh} • مصنعات ${x.proc}${can(x)?` <button class="sm r" onclick="delDoc('sales','${x.id}')">حذف</button>`:''}</div>`).join('')}</div>`},
settings(){return`<div class=card><h3>حسابي</h3>${esc(S.u.email)}<button class=s onclick="out()">تسجيل الخروج</button></div>`+(adm()?`<div class=card><h3>إضافة موظف</h3><label>الاسم</label><input id=nu_n><label>البريد</label><input id=nu_e type=email><label>كلمة المرور (6 أحرف فأكثر)</label><input id=nu_p><div class=err>${msg}</div><button onclick="addUser()">إنشاء الحساب</button></div><div class=card><h3>الموظفون (${S.usr.length})</h3>${S.usr.map(u=>`<div class=it>${esc(u.name)} <small>${u.role=='admin'?'مسؤول':'موظف'}</small></div>`).join('')}</div>`:'')}};
function form(id){const s=SEC[id];let h=`<button class="s sm" onclick="go('check')">رجوع</button><div class=card><h3>${s.t}</h3>`;
 s.meta.forEach(m=>h+=`<label>${m.l}</label>`+(m.o?`<select id=m_${m.k}>${m.o.map(x=>`<option>${x}</option>`).join('')}</select>`:`<input id=m_${m.k}>`));
 (s.nums||[]).forEach(n=>h+=`<label>${n.l}</label><input id=n_${n.k} placeholder="مثال: -18 أو 18-">`);
 if(s.photoOnly)h+=`<label>${s.photoOnly} (اختياري)</label><input type=file accept="image/*" id=po>`;
 s.items.forEach((x,i)=>h+=`<div class=it><b>${x}</b><div class=ch>${OPT.map((o,j)=>`<label class="o o${j}"><input type=radio name=i${i} value="${o}" ${j?'':'checked'} onchange="$('ph${i}').className=${j}?'':'hid'">${o}</label>`).join('')}</div><div id=ph${i} class=hid><input id=nt${i} placeholder="تفاصيل الملاحظة (اختياري)"><input type=file accept="image/*" id=f${i}></div></div>`);
 if(s.waste)h+=`<div class=it><b>المستبعد تلف (اتركه فارغًا إن لم يوجد)</b><label>اسم المنتج</label><input id=w_p><label>عدد ال${s.waste}</label><input type=number id=w_q><label>التاريخ</label><input type=date id=w_d value="${today()}"></div>`;
 return h+`<button id=sv class=gr onclick="saveInsp('${id}')">حفظ الفحص</button></div>`}
window.saveInsp=async id=>{const s=SEC[id];$('sv').disabled=true;$('sv').textContent='جاري الحفظ...';const meta={};s.meta.forEach(m=>meta[m.k]=$('m_'+m.k).value.trim());
 const nums={};let ok=0,note=0,bad=0;(s.nums||[]).forEach(n=>{const v=pn($('n_'+n.k).value);if(v!==null){const g=n.ok(v,meta);nums[n.k]={v,ok:g};g?ok++:bad++}});
 const items=[];for(let i=0;i<s.items.length;i++){const st=document.querySelector(`input[name=i${i}]:checked`).value;st=='مطابق'?ok++:st=='ملاحظة'?note++:bad++;items.push({l:s.items[i],st,note:st=='مطابق'?'':$('nt'+i).value,photo:st=='مطابق'?null:await comp($('f'+i).files[0])})}
 const d={uid:S.u.uid,name:S.name,sec:id,title:s.t,date:today(),ts:Date.now(),meta,nums,items,counts:{ok,note,bad},photo:s.photoOnly?await comp($('po').files[0]):null};
 if(s.waste&&$('w_p').value.trim()&&+$('w_q').value>0)d.waste={product:$('w_p').value.trim(),qty:+$('w_q').value,unit:s.waste,date:$('w_d').value||today()};
 try{await addDoc(collection(db,'inspections'),d);alert('تم حفظ الفحص'+(bad?` (يوجد ${bad} غير مطابق)`:''));go('check')}catch(e){alert('تعذر الحفظ: '+e.message);$('sv').disabled=false}};
window.addIssue=async()=>{const t=$('is_tx').value.trim();if(!t)return alert('اكتب تفاصيل المشكلة');try{await addDoc(collection(db,'issues'),{uid:S.u.uid,name:S.name,sec:$('is_sec').value,text:t,status:'لم يتم الاستجابة',ts:Date.now(),photo:await comp($('is_ph').files[0])});$('is_tx').value=''}catch(e){alert(e.message)}};
window.setSt=(id,v)=>updateDoc(doc(db,'issues',id),{status:v});
window.edIss=id=>{const x=S.iss.find(i=>i.id==id),t=prompt('تعديل التفاصيل',x.text);if(t)updateDoc(doc(db,'issues',id),{text:t})};
window.delDoc=(c,id)=>{if(confirm('هل تريد الحذف نهائيًا؟'))deleteDoc(doc(db,c,id))};
window.addSale=async()=>{const f=+$('sl_f').value||0,r=+$('sl_r').value||0,p=+$('sl_p').value||0;if(!(f+r+p))return alert('أدخل رقمًا واحدًا على الأقل');await addDoc(collection(db,'sales'),{uid:S.u.uid,name:S.name,date:$('sl_d').value||today(),ts:Date.now(),frozen:f,fresh:r,proc:p});['sl_f','sl_r','sl_p'].forEach(i=>$(i).value='')};
window.addUser=async()=>{const n=$('nu_n').value.trim(),e=$('nu_e').value.trim(),p=$('nu_p').value;if(!n||!e||p.length<6){msg='أكمل الحقول (كلمة المرور 6 أحرف على الأقل)';return render()}
 try{const sec=initializeApp(cfg,'sec'+Date.now()),a=getAuth(sec),c=await createUserWithEmailAndPassword(a,e,p);await setDoc(doc(db,'users',c.user.uid),{name:n,role:'user'});await signOut(a);msg='تم إنشاء الحساب ✔';render()}catch(x){msg='تعذر الإنشاء: '+x.code;render()}};
</script></body></html>
